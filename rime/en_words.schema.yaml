# helper schema so that en_words.dict.yaml gets compiled
schema:
  schema_id: en_words
  name: English words (helper)
  version: "1"

engine:
  processors: [ ascii_composer, key_binder, speller, recognizer, selector, navigator, express_editor ]
  segmentors: [ matcher, ascii_segmentor, abc_segmentor, punct_segmentor, fallback_segmentor ]
  translators: [ table_translator ]
  filters: [ uniquifier ]

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"

translator:
  dictionary: en_words
  enable_completion: true
  enable_sentence: false
  enable_user_dict: false
